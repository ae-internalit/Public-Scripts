name: Build APK

on:
  push:
    paths:
      - 'screenshot-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        working-directory: screenshot-app
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: screenshot-app
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK after its version
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' screenshot-app/app/build.gradle.kts)
          # Every release used to be called DoubleTapScreenshot.apk, so copies
          # piled up as "(1)", "(2)" in Downloads and browsers served the
          # cached one. The version in the name makes each build distinct.
          NAME="DoubleTapScreenshot-v${VERSION}.apk"
          cp screenshot-app/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"
          du -h "$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DoubleTapScreenshot
          path: ${{ steps.apk.outputs.name }}

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}.${{ github.run_number }}
          name: DoubleTap Screenshot v${{ steps.apk.outputs.version }}
          body: |
            ## DoubleTap Screenshot v${{ steps.apk.outputs.version }}

            Download the APK file below (${{ steps.apk.outputs.size }}) and install it on your Android phone.

            ### How to install:
            1. Download `${{ steps.apk.outputs.name }}` below
            2. Open it on your phone
            3. Tap "Install" (allow "Install from unknown sources" if asked)
            4. Open the app and follow the setup

            If you are updating, turn the accessibility service off and back on
            afterwards so Android reloads the service configuration.

            Requires Android 9 or newer.
          files: ${{ steps.apk.outputs.name }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
